name: Deploy Infrastructure

on:
  workflow_dispatch:
  push:
    paths:
      - "infra/**"
    branches:
      - master
  pull_request:
    paths:
      - "infra/**"
    branches:
      - master

env:
  AWS_REGION: ap-northeast-1
  TF_STATE_BUCKET: terraform-state-todo-app-hiroyuki 
  TF_LOCK_TABLE: terraform-lock

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/todo-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Cache Terraform
        uses: actions/cache@v3
        with:
          path: .terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}
          restore-keys: ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: |
          cd infra/terraform/app
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Format
        run: cd infra/terraform/app && terraform fmt -check

      - name: Terraform Plan
        id: plan
        run: |
          cd infra/terraform/app
          terraform plan -detailed-exitcode -out=tfplan
        continue-on-error: true

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          cd infra/terraform/app
          terraform apply -auto-approve tfplan