name: Deploy Application

on:
  workflow_dispatch:  # 手動実行を追加
  push:
    paths:
      - "app/**"
    branches:
      - master

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com
  TF_STATE_BUCKET: terraform-state-todo-app-hiroyuki 
  TF_LOCK_TABLE: terraform-lock

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/todo-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          # 認証情報の有効期限を1時間に設定
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Cache Terraform
        uses: actions/cache@v3
        with:
          path: |
            .terraform
            ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf', '**/terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Install ecspresso
        uses: kayac/ecspresso@v2
        with:
          version: v2.6.0 

      - name: Get Terraform Outputs
        id: terraform-output-app
        run: |
          terraform -chdir=infra/terraform/app init -input=false -reconfigure \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"
          terraform -chdir=infra/terraform/app output -json
          ONE_LINE=$(terraform -chdir=infra/terraform/app output -json | jq -c .)
          echo "outputs=$ONE_LINE" >> "$GITHUB_OUTPUT"

      - name: Get Terraform Outputs
        id: terraform-output-shared
        run: |
          terraform -chdir=infra/terraform/shared init -input=false -reconfigure \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=shared/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"
          terraform -chdir=infra/terraform/shared output -json
          ONE_LINE=$(terraform -chdir=infra/terraform/shared output -json | jq -c .)
          echo "outputs=$ONE_LINE" >> "$GITHUB_OUTPUT"

      - name: Generate Definitions
        env:
          TF_OUTPUT_APP: ${{ steps.terraform-output-app.outputs.outputs }}
          TF_OUTPUT_SHARED: ${{ steps.terraform-output-shared.outputs.outputs }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/gen-service-def.sh
          ./scripts/gen-task-def.sh

      - name: Deploy to ECS
        id: deploy
        run: |
          set -e
          ecspresso deploy --config .ecspresso/config.yml || {
            echo "::error::Deployment failed"
            exit 1
          }