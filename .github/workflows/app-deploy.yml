name: Deploy Application

on:
  workflow_dispatch:  # 手動実行を追加
  push:
    paths:
      - "app/**"
    branches:
      - master

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/todo-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          # 認証情報の有効期限を1時間に設定
          role-duration-seconds: 3600

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Cache Terraform
        uses: actions/cache@v3
        with:
          path: |
            .terraform
            ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf', '**/terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Install ecspresso
        uses: kayac/ecspresso@v2
        with:
          version: v2.6.0 

      - name: Get Terraform Outputs
        id: terraform-output
        run: |
          cd infra/terraform/app
          terraform init
          echo "outputs=$(terraform output -json)" >> $GITHUB_OUTPUT

      - name: Generate Definitions
        run: |
          chmod +x scripts/*.sh
          ./scripts/gen-service-def.sh
          ./scripts/gen-task-def.sh
        env:
          TF_OUTPUT: ${{ steps.terraform-output.outputs.outputs }}

      - name: Show taskdef secrets
        run: |
          jq -r '.containerDefinitions[].secrets[]?| "\(.name)=\(.valueFrom)"' .ecspresso/task-def.json

      - name: Assert secret references are valid
        run: |
          set -euo pipefail
          FILE=.ecspresso/taskdef.json   # ← ファイル名を統一
          test -f "$FILE"

          # secrets の valueFrom を一度だけ取得
          SECRET_VALUES=$(jq -r '.containerDefinitions[].secrets[]?.valueFrom' "$FILE")
          TOTAL=$(jq '[.containerDefinitions[].secrets[]?] | length' "$FILE")

          # secrets が無ければスキップ
          if [ "$TOTAL" -eq 0 ]; then
            echo "No secrets in taskdef (skip check)"
            exit 0
          fi

          # Secrets Manager ARN か SSM Parameter のどちらかに一致した数を数える
          ARNS_OK=$(echo "$SECRET_VALUES" | awk '/^arn:aws:secretsmanager:/{c++} END{print c+0}')
          SSM_OK=$(echo "$SECRET_VALUES" | awk '/^\//{c++} END{print c+0}')

          if [ $((ARNS_OK + SSM_OK)) -ne "$TOTAL" ]; then
            echo "::group::Invalid secret references"
            [ -n "$SECRET_VALUES" ] && echo "$SECRET_VALUES" | grep -vE '^arn:aws:secretsmanager:|^/' || true
            echo "::endgroup::"
            echo "::error::Invalid secret reference(s). Expected Secrets Manager ARN (arn:aws:secretsmanager:...) or SSM parameter path (/...)."
            exit 1
          fi

      - name: Deploy to ECS
        id: deploy
        run: |
          set -e
          ecspresso deploy --config .ecspresso/config.yml || {
            echo "::error::Deployment failed"
            exit 1
          }