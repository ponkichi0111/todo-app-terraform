version: "3.9"
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.development
    ports:
      - "4000:4000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: todo-db
    env_file:
      - .env.db
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: